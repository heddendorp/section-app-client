query getInitialUserGridData {
  currentTenant {
    id
    createdAt
    settings {
      userDataCollection {
        type
        label
        options
      }
    }
  }
}

query getUsersForUserGrid(
  $startRow: Int!
  $endRow: Int!
  $sortModel: [SortModelInput!]!
  $filterModel: JSONObject!
  $eventId: ID
) {
  gridUsers(
    startRow: $startRow
    endRow: $endRow
    sortModel: $sortModel
    filterModel: $filterModel
    eventId: $eventId
  ) {
    id
    createdAt
    joinedAt
    esnCardValidUntil
    firstName
    lastName
    email
    position
    picture
    additionalData
    status
    role
    lastAttendedEvent
  }
  gridUsersCount(filterModel: $filterModel, eventId: $eventId)
}

query exportUsersCSV(
  $filterModel: JSONObject!
  $sortModel: [SortModelInput!]!
) {
  exportUsersCSV(filterModel: $filterModel, sortModel: $sortModel)
}

# Past-year events for autocomplete (most recent first)
query getEventsForUserGrid(
  $after: DateTime!
  $before: DateTime!
  $search: String
  $limit: Int
  $reverseOrder: Boolean
) {
  events(
    after: $after
    before: $before
    search: $search
    limit: $limit
    reverseOrder: $reverseOrder
  ) {
    id
    title
    start
  }
}
