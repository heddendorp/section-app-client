query loadEventForManagement($id: ID!) {
  event(id: $id) {
    id
    title
    icon
    start
    #financial
    amountCollected
    netAmountCollected
    feesPaid
    refundFeesPaid
    plannedSpend
    submittedSpend
    deferredPayment
    participantLimit
    participantRegistrationCount
    totalGuestsCount
    totalRegisteredCount
    participantsAttended
    registrationMode
    multiGuestSettings {
      enabled
      additionalGuestPrice
      maxPerRegistration
    }
    #registrations
    costItems {
      id
      name
      submittedAmount
      amount
    }
    # template
    eventTemplate {
      id
      title
    }
    eventRegistrationCodes {
      id
      createdAt
      isPublic
      status
      registrationToRemoveId
      registrationCreatedId
    }
    organizerRegistrations {
      id
      createdAt
      status
      user {
        id
        fullName
        picture
        email
        additionalData
        currentTenant {
          userId
          tenantId
          status
        }
      }
    }
    submissionItems {
      id
      name
    }
    participantRegistrations(includeCancelled: true) {
      id
      createdAt
      status
      cancellationReason
      balance
      guestCount
      guestUnitPrice
      guestCheckIns
      totalPartySize
      remainingEntries
      usageLog {
        timestamp
        actorId
        manual
        note
      }
      transactions {
        id
        status
        direction
        amount
        type
        subject
      }
      checkInTime
      didAttend
      submissions {
        id
        data
        submissionItem {
          id
          name
        }
      }
      user {
        id
        fullName
        firstName
        lastName
        picture
        phone
        email
        additionalData
        currentTenant {
          userId
          tenantId
          status
        }
      }
    }
  }
}

mutation admitUser($registrationId: ID!) {
  approvePayment(registrationId: $registrationId) {
    id
    participantRegistrations {
      id
      transactions {
        id
        status
        direction
        amount
        type
        subject
      }
    }
  }
}

mutation deleteRegistrationCode($id: ID!) {
  deleteRegistrationCode(id: $id) {
    id
  }
}
