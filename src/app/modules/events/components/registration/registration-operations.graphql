mutation registerForEvent(
  $eventId: ID!
  $type: RegistrationType
  $submissions: JSON
  $price: JSON
  $guestCount: Int
) {
  registerForEvent(
    eventId: $eventId
    registrationType: $type
    submissions: $submissions
    price: $price
    guestCount: $guestCount
  ) {
    id
    organizerRegistrationPossible
    participantRegistrationPossible
    organizersRegistered
    participantRegistrationCount
    totalRegisteredCount
    couldBeOrganizer
    userIsRegistered
    activeRegistration {
      id
      type
      status
      cancellationReason
      guestCount
      guestUnitPrice
      totalPartySize
      remainingEntries
      transactions {
        id
        status
        direction
        amount
        type
        subject
        stripePayment {
          id
          createdAt
          amount
          status
          checkoutUrl
          paymentIntent
        }
      }
    }
    organizers {
      fullName
    }
  }
}

mutation deregisterFromEvent($registrationId: ID!) {
  deregisterFromEvent(registrationId: $registrationId) {
    id
    participantRegistrationPossible
    participantRegistrations(includeCancelled: true) {
      id
      status
    }
    activeRegistration {
      id
    }
    organizers {
      id
      fullName
      picture
    }
    participantRegistrationCount
    userIsRegistered
  }
}

mutation cancelPayment($registrationId: ID!) {
  cancelPayment(registrationId: $registrationId) {
    id
    userIsRegistered
    participantRegistrationPossible
    activeRegistration {
      id
      type
      status
      cancellationReason
      transactions {
        id
        status
        direction
        amount
        type
        subject
        stripePayment {
          id
          createdAt
          amount
          status
          checkoutSession
          paymentIntent
        }
      }
    }
  }
}
