query getTenantCurrencyCode {
  currentTenant {
    id
    currency
  }
}

query getAppStartupInfo {
  currentTenant {
    id
    currency
    homePageStrategy
    homePageLink
    contractEnd
    hardContractEnd
    settings {
      showPWAInstall
      timezone
      brandIconUrl
      userDataCollection {
        label
        options
        type
      }
      banners {
        title
        body
        color
        link
        displayToMembershipStatus
      }
    }
  }
}
