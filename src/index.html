<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="content-language" content="en" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>{{tenant.seoTitle}}</title>
    <meta content="{{tenant.seoDescription}}" name="description" />
    <meta content="/assets/favicon/android-chrome-512x512.png" name="image" />
    <meta content="{{tenant.seoTitle}}" property="og:title" />
    <meta content="{{tenant.seoDescription}}" property="og:description" />
    <meta content="{{canonicalUrl}}" property="og:url" />
    {{#if ogImage}}
    <meta content="{{ogImage}}" property="og:image" />
    {{else}}
    <meta
      content="/assets/favicon/android-chrome-512x512.png"
      property="og:image"
    />
    {{/if}}
    <link rel="canonical" href="{{canonicalUrl}}" />
    <meta property="og:type" content="website" />
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <link
      rel="mask-icon"
      href="/assets/favicon/safari-pinned-tab.svg"
      color="#3B82F6"
    />
    <meta name="msapplication-TileColor" content="#3B82F6" />
    <meta
      name="msapplication-config"
      content="/assets/favicon/browserconfig.xml"
    />
    <meta content="#3B82F6" name="theme-color" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body class="bg-gray-100">
    <app-root>
      <img
        class="fixed left-1/2 top-1/2 w-[33vw] max-w-[192px] -translate-x-1/2 -translate-y-1/2 transform"
        src="/assets/logos/star-color.svg"
        alt="ESN Star"
        height="16"
        width="16"
      />
      {{#if events}}
      <div style="opacity: 0">
        <h1>Events for {{tenant.seoTitle}}</h1>
        <ul>
          {{#each events}}
          <li>
            <a
              href="{{../canonicalUrl}}/{{this.id}}"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{this.title}} - {{this.date}}
            </a>
          </li>
          {{/each}}
        </ul>
      </div>
      {{else}}
      <p style="opacity: 0"> {{tenant.seoDescription}} </p>
      {{/if}}
    </app-root>
    <noscript>
      Please enable JavaScript to continue using this application.
    </noscript>
    <script defer src="https://assets.onedollarstats.com/stonks.js"></script>
  </body>
</html>
